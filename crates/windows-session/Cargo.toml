[package]
name = "vc-workspace-windows-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
vc-workspace-guest-lifecycle = { path = "../guest-lifecycle" }
getrandom = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory",
  "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_System_JobObjects",
  "Win32_System_Environment",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_NetworkManagement_NetManagement",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_Registry", "Win32_UI_Shell", "Win32_System_GroupPolicy", "Win32_Security_Cryptography", "Win32_Security_Authentication_Identity"] }
