[package]
name = "vc-workspace-guest-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vc-workspace-windows-session = { path = "../windows-session" }
vc-workspace-guest-lifecycle = { path = "../guest-lifecycle" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
enigo = "=0.6.1"
image = { version = "=0.25.5", default-features = false, features = ["jpeg"] }
xcap = "=0.9.8"
getrandom = "=0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "net", "process", "event"] }
atspi = { version = "=0.29.0", default-features = false, features = ["proxies"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = "5.5"

[target.'cfg(target_os = "windows")'.dependencies]
# 0.25.0 core imports inputs::MouseButton even when callers only use UIA;
# retain this feature until upstream's feature-independent core compiles.
uiautomation = { version = "=0.25.0", default-features = false, features = ["input"] }
