name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: vcw-ci-disposable
          POSTGRES_DB: vcw_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VC_WORKSPACE_TEST_DATABASE_URL: postgres://postgres:vcw-ci-disposable@127.0.0.1:5432/vcw_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux Computer Use build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxrandr-dev libxtst-dev pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -race ./internal/store ./internal/httpapi ./internal/gateway ./internal/guestdesktop -count=2
      - name: Build control-plane container including embedded assets
        run: docker build -f deploy/container/control-plane.Dockerfile -t vc-workspace-control-plane:ci .
      - name: Build standalone TLS session Gateway
        run: docker build -f deploy/container/session-gateway.Dockerfile -t vc-workspace-session-gateway:ci .
      - run: make iac-check
      - run: cargo test --workspace
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @vc-workspace/web exec playwright install --with-deps chromium
      - name: Browser session and job recovery on the production build
        run: |
          pnpm --filter @vc-workspace/web exec vite preview --host 127.0.0.1 --port 5188 --strictPort &
          vcw_preview_pid=$!
          trap 'kill "$vcw_preview_pid"' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:5188/console > /dev/null
          pnpm --filter @vc-workspace/web test:browser

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: swift test
        working-directory: clients/macos
      - run: ./scripts/build-app.sh release
        working-directory: clients/macos
      - name: Mac WSS tunnel and bundled native Guest certificate pin
        run: make macos-gateway-check
      - name: Native RDP reactivation and receive-failure classification
        run: make macos-rdp-reactivation-check
      - run: plutil -lint 'App/Info.plist'
        working-directory: clients/macos
      - run: codesign --verify --deep --strict --verbose=2 '.build/app/VC Workspace.app'
        working-directory: clients/macos

  linux-computer-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Separate real UIDs, displays, input and peer authentication
        run: make computer-session-check

  headless-session-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Native TLS pin and process lifetime in an isolated Linux container
        run: make session-worker-container-check

  guest-agent-artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vc-workspace-guest-agent-linux-amd64
            path: |
              target/release/vc-workspace-guest-agent
              target/release/pam_vcworkspace.so
              target/release/pam_vcworkspace_native.so
          - os: windows-latest
            artifact: vc-workspace-guest-agent-windows-amd64
            path: target/release/vc-workspace-guest-agent.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Linux Computer Use build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev libgbm-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxrandr-dev libxtst-dev libpam0g-dev libsystemd-dev pkg-config
      - run: cargo build --release --package vc-workspace-guest-agent
      - name: Build the in-process Linux PAM bridge
        if: runner.os == 'Linux'
        run: cc -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared -Wl,-z,relro,-z,now,-z,noexecstack,-z,defs -o target/release/pam_vcworkspace.so crates/guest-agent/native/linux/pam_vcworkspace.c -lpam -lsystemd
      - name: Build the separate Native Linux PAM bridge
        if: runner.os == 'Linux'
        run: cc -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared -DVC_WORKSPACE_NATIVE_PAM -Wl,-z,relro,-z,now,-z,noexecstack,-z,defs -o target/release/pam_vcworkspace_native.so crates/guest-agent/native/linux/pam_vcworkspace.c -lpam -lsystemd
      - name: Windows session identity and authenticated pipe regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # schtasks /Delete on a missing task exits non-zero; check native
          # exit codes explicitly instead of aborting on every one.
          $PSNativeCommandUseErrorActionPreference = $false

          # valid_account_sid() accepts only S-1-5-18 or S-1-5-21-...-RID>=1000,
          # so the runner's own account cannot bind the helper pipe. Build here,
          # then run the suite under a disposable managed account, and the one
          # require_system() case as LocalSystem.
          $artifacts = cargo test --locked -p vc-workspace-windows-session --no-run --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.test }
          $built = ($artifacts | Where-Object { $_.target.name -eq 'vc-workspace-windows-session' } |
            Select-Object -Last 1).executable
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed with exit code $LASTEXITCODE" }
          if (-not $built) { throw 'no vc-workspace-windows-session test executable' }

          # Staged outside the workspace: the managed account gets read/execute
          # here and no access to cargo, rustup or the registry cache.
          $stage = 'C:\vcw-windows-session'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $target = Join-Path $stage 'windows-session-tests.exe'
          Copy-Item $built $target -Force

          $account = 'vcwci'
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + '!Aa1'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          Remove-LocalUser -Name $account -ErrorAction SilentlyContinue
          New-LocalUser -Name $account -Password $secure -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          # Administrators keeps the registry and worker cases that already pass
          # as the runner account; the SID still carries RID >= 1000.
          Add-LocalGroupMember -Group 'Administrators' -Member $account
          $acl = Get-Acl $stage
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            $account, 'ReadAndExecute', 'ContainerInherit,ObjectInherit', 'None', 'Allow')))
          Set-Acl -Path $stage -AclObject $acl

          # Scheduled tasks avoid the UAC-filtered token that Start-Process
          # -Credential would hand a local administrator.
          function Invoke-Staged([string] $label, [string] $taskArgs, [string] $runAs, [string] $runPassword) {
            $out = Join-Path $stage "$label-out.txt"
            $code = Join-Path $stage "$label-code.txt"
            $script = Join-Path $stage "$label.cmd"
            @"
          @echo off
          "$target" $taskArgs > "$out" 2>&1
          echo %ERRORLEVEL% > "$code"
          "@ | Set-Content -Path $script -Encoding ASCII
            $name = "vcw-$label"
            schtasks /Delete /TN $name /F *> $null
            if ($runPassword) {
              schtasks /Create /TN $name /TR "`"$script`"" /SC ONCE /ST 00:00 /RU $runAs /RP $runPassword /RL HIGHEST /F | Out-Null
            } else {
              schtasks /Create /TN $name /TR "`"$script`"" /SC ONCE /ST 00:00 /RU $runAs /RL HIGHEST /F | Out-Null
            }
            schtasks /Run /TN $name | Out-Null
            $deadline = (Get-Date).AddMinutes(10)
            $status = $null
            while ($null -eq $status) {
              if ((Get-Date) -gt $deadline) { throw "$label run timed out" }
              Start-Sleep -Seconds 2
              if (-not (Test-Path $code)) { continue }
              $text = (Get-Content $code -Raw).Trim()
              if ($text -match '^-?\d+$') { $status = [int] $text }
            }
            schtasks /Delete /TN $name /F *> $null
            if (Test-Path $out) { Get-Content $out }
            if ($status -ne 0) { throw "$label run failed with exit code $status" }
          }

          $systemOnly = 'platform::registry::accounts::native::secret::tests::system_secret_is_owner_bound_and_never_serializes_plaintext'
          Invoke-Staged 'managed' "--test-threads=1 --skip $systemOnly" "$env:COMPUTERNAME\$account" $password
          Invoke-Staged 'system' "--test-threads=1 --exact $systemOnly" 'SYSTEM' ''

          Remove-LocalUser -Name $account -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
