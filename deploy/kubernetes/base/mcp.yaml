apiVersion: v1
kind: Service
metadata:
  name: vc-workspace-mcp
  labels:
    app.kubernetes.io/name: vc-workspace-mcp
    app.kubernetes.io/part-of: vc-workspace
spec:
  selector:
    app.kubernetes.io/name: vc-workspace-mcp
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vc-workspace-mcp
  labels:
    app.kubernetes.io/name: vc-workspace-mcp
    app.kubernetes.io/part-of: vc-workspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vc-workspace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vc-workspace-mcp
        app.kubernetes.io/part-of: vc-workspace
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/veritas-calculus/vc-workspace-mcp:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: vc-workspace-mcp
            - secretRef:
                name: vc-workspace-mcp
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
