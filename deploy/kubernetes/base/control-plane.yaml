apiVersion: v1
kind: Service
metadata:
  name: vc-workspace-control-plane
  labels:
    app.kubernetes.io/name: vc-workspace-control-plane
    app.kubernetes.io/part-of: vc-workspace
spec:
  selector:
    app.kubernetes.io/name: vc-workspace-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vc-workspace-control-plane
  labels:
    app.kubernetes.io/name: vc-workspace-control-plane
    app.kubernetes.io/part-of: vc-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vc-workspace-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vc-workspace-control-plane
        app.kubernetes.io/part-of: vc-workspace
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/veritas-calculus/vc-workspace-control-plane:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: vc-workspace-control-plane
            - secretRef:
                name: vc-workspace-control-plane
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
