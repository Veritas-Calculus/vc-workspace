apiVersion: v1
kind: Service
metadata:
  name: vc-workspace-web
  labels:
    app.kubernetes.io/name: vc-workspace-web
    app.kubernetes.io/part-of: vc-workspace
spec:
  selector:
    app.kubernetes.io/name: vc-workspace-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vc-workspace-web
  labels:
    app.kubernetes.io/name: vc-workspace-web
    app.kubernetes.io/part-of: vc-workspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vc-workspace-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vc-workspace-web
        app.kubernetes.io/part-of: vc-workspace
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/veritas-calculus/vc-workspace-web:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
