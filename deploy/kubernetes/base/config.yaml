apiVersion: v1
kind: ConfigMap
metadata:
  name: vc-workspace-control-plane
  labels:
    app.kubernetes.io/part-of: vc-workspace
data:
  VC_VDI_HTTP_ADDR: 0.0.0.0:8080
  VC_VDI_PUBLIC_URL: https://workspace.example.com
  VC_VDI_NATIVE_CALLBACK_URL: vc-vdi://auth/callback
  VC_VDI_PVE_ENDPOINT: https://pve.example.com:8006
  VC_VDI_PVE_MUTATIONS_ENABLED: "false"
  VC_VDI_IMAGE_BUILDER_ENABLED: "false"
  VC_VDI_OIDC_NAME: Organization SSO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vc-workspace-mcp
  labels:
    app.kubernetes.io/part-of: vc-workspace
data:
  VC_VDI_API_URL: http://vc-workspace-control-plane:8080
  VC_VDI_MCP_TRANSPORT: http
  VC_VDI_MCP_HTTP_ADDR: 0.0.0.0:8090
