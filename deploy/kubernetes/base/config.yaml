apiVersion: v1
kind: ConfigMap
metadata:
  name: vc-workspace-control-plane
  labels:
    app.kubernetes.io/part-of: vc-workspace
data:
  VC_WORKSPACE_HTTP_ADDR: 0.0.0.0:8080
  VC_WORKSPACE_PUBLIC_URL: https://workspace.example.com
  VC_WORKSPACE_NATIVE_CALLBACK_URL: vc-workspace://auth/callback
  VC_WORKSPACE_PVE_ENDPOINT: https://pve.example.com:8006
  VC_WORKSPACE_PVE_MUTATIONS_ENABLED: "false"
  VC_WORKSPACE_IMAGE_BUILDER_ENABLED: "false"
  VC_WORKSPACE_OIDC_NAME: Organization SSO
  VC_WORKSPACE_OIDC_GROUPS_CLAIM: groups
  VC_WORKSPACE_EXPERIMENTAL_SSSD_OIDC_ENABLED: "false"
  VC_WORKSPACE_EXPERIMENTAL_WINDOWS_ENTRA_RDP_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vc-workspace-mcp
  labels:
    app.kubernetes.io/part-of: vc-workspace
data:
  VC_WORKSPACE_API_URL: http://vc-workspace-control-plane:8080
  VC_WORKSPACE_MCP_TRANSPORT: http
  VC_WORKSPACE_MCP_HTTP_ADDR: 0.0.0.0:8090
