apiVersion: v1
kind: Service
metadata:
  name: vc-workspace-postgres
  labels:
    app.kubernetes.io/name: vc-workspace-postgres
    app.kubernetes.io/part-of: vc-workspace
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vc-workspace-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vc-workspace-postgres
  labels:
    app.kubernetes.io/name: vc-workspace-postgres
    app.kubernetes.io/part-of: vc-workspace
spec:
  serviceName: vc-workspace-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vc-workspace-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vc-workspace-postgres
        app.kubernetes.io/part-of: vc-workspace
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DB
              value: vc_workspace
            - name: POSTGRES_USER
              value: vc_workspace
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vc-workspace-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, vc_workspace, -d, vc_workspace]
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command: [pg_isready, -U, vc_workspace, -d, vc_workspace]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, vc_workspace, -d, vc_workspace]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
