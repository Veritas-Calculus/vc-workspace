apiVersion: v1
kind: Secret
metadata:
  name: vc-workspace-postgres
  namespace: vc-workspace
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-random-database-password
---
apiVersion: v1
kind: Secret
metadata:
  name: vc-workspace-control-plane
  namespace: vc-workspace
type: Opaque
stringData:
  VC_WORKSPACE_DATABASE_URL: postgres://vc_workspace:replace-with-a-random-database-password@vc-workspace-postgres:5432/vc_workspace?sslmode=disable
  VC_WORKSPACE_SETUP_TOKEN: replace-with-a-random-one-time-setup-token
  VC_WORKSPACE_INTERNAL_API_TOKEN: replace-with-a-random-internal-service-token
  VC_WORKSPACE_PVE_TOKEN_ID: replace-with-a-least-privilege-pve-token-id
  VC_WORKSPACE_PVE_TOKEN_SECRET: replace-with-the-pve-token-secret
  VC_WORKSPACE_OIDC_CLIENT_ID: ""
  VC_WORKSPACE_OIDC_CLIENT_SECRET: ""
  VC_WORKSPACE_OIDC_ISSUER: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: vc-workspace-mcp
  namespace: vc-workspace
type: Opaque
stringData:
  VC_WORKSPACE_INTERNAL_API_TOKEN: replace-with-the-same-internal-service-token
