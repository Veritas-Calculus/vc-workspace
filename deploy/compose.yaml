name: vc-workspace

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vc_workspace
      POSTGRES_USER: vc_workspace
      POSTGRES_PASSWORD: vc_workspace
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - vc-workspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vc_workspace -d vc_workspace"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vc-workspace-postgres:
