#cloud-config
package_update: false
package_upgrade: false

apt:
  preserve_sources_list: false
  sources_list: |
    deb http://10.31.0.2/debian trixie main contrib non-free-firmware
    deb http://10.31.0.2/debian trixie-updates main contrib non-free-firmware
    deb http://10.31.0.2/debian-security trixie-security main contrib non-free-firmware
  conf: |
    APT::Install-Recommends "false";
    APT::Install-Suggests "false";

users:
  - default
  - name: vdi
    gecos: VC Workspace Desktop User
    groups: audio,video
    shell: /bin/bash
    lock_passwd: true

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/profile.d/vc-vdi-xrdp.sh
    permissions: "0644"
    content: |
      if [ -n "$XRDP_SESSION" ]; then
        export DESKTOP_SESSION=xfce
      fi
  - path: /usr/local/sbin/vc-vdi-rdp-ready
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -d -m 0755 /var/lib/vc-vdi
      rm -f /var/lib/vc-vdi/desktop-ready
      for _ in $(seq 1 90); do
        if timeout 1 bash -c '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
          printf 'ready\n' >/var/lib/vc-vdi/desktop-ready
          exit 0
        fi
        sleep 1
      done
      exit 1
  - path: /etc/systemd/system/vc-vdi-readiness.service
    permissions: "0644"
    content: |
      [Unit]
      Description=VC Workspace RDP readiness marker
      After=xrdp.service network-online.target
      Wants=xrdp.service network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/vc-vdi-rdp-ready
      RemainAfterExit=yes

      [Install]
      WantedBy=graphical.target
  - path: /usr/local/sbin/vc-vdi-provision-desktop
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec > >(tee -a /var/log/vc-vdi-provision.log) 2>&1
      export DEBIAN_FRONTEND=noninteractive
      export NEEDRESTART_MODE=a
      apt_options=(-o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold)

      rm -f /var/lib/vc-vdi/desktop-ready
      for source_file in /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
        [ -e "$source_file" ] || continue
        mv "$source_file" "$source_file.vc-vdi-disabled"
      done
      cat >/etc/apt/sources.list <<'SOURCES'
      deb http://10.31.0.2/debian trixie main contrib non-free-firmware
      deb http://10.31.0.2/debian trixie-updates main contrib non-free-firmware
      deb http://10.31.0.2/debian-security trixie-security main contrib non-free-firmware
      SOURCES

      dpkg --configure -a
      apt-get update
      apt-get "${apt_options[@]}" install -y ca-certificates qemu-guest-agent
      systemctl enable --now qemu-guest-agent

      apt-get "${apt_options[@]}" upgrade -y --without-new-pkgs
      apt-get "${apt_options[@]}" full-upgrade -y
      apt-get "${apt_options[@]}" install -y \
        adwaita-icon-theme \
        dbus-x11 \
        spice-vdagent \
        thunar \
        xfce4-panel \
        xfce4-session \
        xfce4-terminal \
        xfdesktop4 \
        xfwm4 \
        xorgxrdp \
        xrdp

      . /etc/os-release
      test "${VERSION_CODENAME:-}" = trixie

      install -d -o vdi -g vdi /home/vdi
      printf 'startxfce4\n' >/home/vdi/.xsession
      chown vdi:vdi /home/vdi/.xsession
      chmod 0600 /home/vdi/.xsession
      usermod -aG ssl-cert xrdp

      systemctl daemon-reload
      systemctl enable qemu-guest-agent xrdp vc-vdi-readiness.service
      systemctl set-default graphical.target
      systemctl restart xrdp
      systemctl restart vc-vdi-readiness.service
      shutdown -r +1 'VC Workspace Debian 13 desktop provisioning complete'

runcmd:
  - [bash, /usr/local/sbin/vc-vdi-provision-desktop]

final_message: VC Workspace Debian 13 desktop provisioning completed
